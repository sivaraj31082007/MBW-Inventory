<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MBW Billing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#f4f5fa;--cd:#fff;--tx:#161a33;--mu:#5b6188;--ln:#c8cde6;--ac:#1c2a78;--on:#fff;--dg:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11131f;--cd:#1b1f33;--tx:#e8eaf8;--mu:#9aa1cc;--ln:#343b66;--ac:#aab4ff;--on:#11131f;--dg:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11131f;--cd:#1b1f33;--tx:#e8eaf8;--mu:#9aa1cc;--ln:#343b66;--ac:#aab4ff;--on:#11131f;--dg:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px 12px 40px}
h1{font-size:19px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center;color:var(--ac)}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
[hidden]{display:none!important}
.c h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 8px}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px;margin-top:3px}
.r{display:flex;gap:8px}.r>*{flex:1;min-width:0}
button{font:inherit;border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:8px;padding:10px 12px}
button.p{background:var(--ac);color:var(--on);font-weight:600}
button.x{border:0;color:var(--dg);padding:2px 8px;font-size:20px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.chips button{white-space:nowrap;padding:5px 10px;font-size:13px}
.u{border-top:1px dashed var(--ln);padding-top:6px;margin-top:4px}.u .r{align-items:flex-end}.u button{margin-bottom:8px;padding:9px}
.amt{font-weight:700;text-align:right;color:var(--ac)}
.tot{font-size:22px;font-weight:700;text-align:right;color:var(--ac)}
#sc{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#sc[hidden]{display:none}#vid{width:100%;max-height:70%}
#ts{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--on);padding:10px 14px;border-radius:8px;z-index:10;text-align:center}
#ts[hidden]{display:none}
</style></head><body><main>
<h1>Mahesh Battery Works <button id="gear" type="button">Settings</button></h1>
<section class="c" id="set" hidden><h2>Settings</h2>
<label>Language / மொழி<select id="slg"><option value="en">English</option><option value="ta">தமிழ்</option><option value="both">தமிழ் + English</option></select></label>
<label>Next invoice sequence for this year<input id="ssq" type="number"></label>
<label>Brands (one per line, Other is added automatically)<textarea id="sbr" rows="6"></textarea></label>
<label>Usage types (one per line). Keep the names Inverter and Inverter Battery so VA and Ah work.<textarea id="sus" rows="5"></textarea></label>
<div class="r"><label>Print shift right (mm, minus = left)<input id="sox" type="number" step="0.5"></label><label>Print shift down (mm, minus = up)<input id="soy" type="number" step="0.5"></label></div>
<label>Warranty line on batteries<select id="swr"><option value="0">Off</option><option value="1">On</option></select></label>
<div class="r"><label>Advance line<select id="sad"><option value="0">Off</option><option value="1">On</option></select></label><label>Paid and balance lines<select id="spd"><option value="0">Off</option><option value="1">On</option></select></label></div>
<label>Thank-you line on the bill (empty = none)<input id="sty"></label>
<label>Text size<select id="stz"><option value="1">Normal</option><option value="1.15">Large</option><option value="1.3">Extra large</option></select></label>
<label>Google Sheet link (Apps Script web app URL, empty = off)<input id="sgs" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label>
<button id="sgn" type="button" style="width:100%;margin-bottom:8px">Send all saved bills to Google Sheet now</button>
<div class="g"><button class="p" id="ssv" type="button">Save settings</button><button id="stp" type="button">Print test page</button><button id="srs" type="button">Reset lists</button><button id="scl" type="button">Close</button></div></section>
<section class="c"><div class="r">
<label>Invoice No.<input id="inv" type="text" autocapitalize="characters" placeholder="MBW26-001"></label>
<label>Date<input id="dt" type="date"></label></div></section>
<section class="c"><h2>Customer (all optional)</h2>
<label>Name<input id="cn"></label><label>Address<input id="ca"></label>
<div class="r"><label>Vehicle no.<input id="cv"></label><label>Phone<input id="cp" type="tel" inputmode="tel"></label></div>
<div id="vw" style="color:var(--dg);font-size:13px;margin-bottom:6px"></div><div class="chips" id="rec"></div></section>
<div id="items"></div>
<div class="g"><button class="p" data-add="bat" type="button">+ Battery / Inverter</button><button class="p" data-add="water" type="button">+ Distilled water</button>
<button class="p" data-add="custom" type="button">+ Custom item</button><button class="p" data-add="disc" type="button">+ Discount / old battery</button></div>
<section class="c"><label>Mode of payment<select id="pm"><option value="Cash">Cash</option><option value="UPI">UPI</option><option value="Card">Card</option><option value="Credit">Credit</option><option value="Other">Other</option></select></label>
<label id="pmo" hidden>Other mode<input id="pmt"></label>
<div class="tot" id="tot">Total: Rs. 0</div><div class="r" id="pay" hidden style="margin-top:8px"><label id="adl" hidden>Advance (Rs.)<input id="adv" type="number" inputmode="decimal"></label><label id="pdl" hidden>Paid (Rs.)<input id="pdv" type="number" inputmode="decimal"></label></div><div class="amt" id="bal"></div></section>
<div class="g"><button class="p" id="dl" type="button">Digital PDF (full bill)</button><button class="p" id="sh" type="button">Share on WhatsApp</button></div>
<div class="g"><button class="p" id="im" type="button" style="grid-column:1/-1">Share bill as image</button><button class="p" id="pr" type="button" style="grid-column:1/-1">Print on bill book (opens print)</button><button id="wa" type="button">WhatsApp to customer number</button><button id="nb" type="button">New bill</button><button id="xl" type="button" style="grid-column:1/-1">Download all bills as Excel</button></div>
</main>
<div id="sc" hidden><video id="vid" playsinline muted></video><button class="p" id="scx" type="button">Close scanner</button></div>
<div id="ts" hidden></div>
